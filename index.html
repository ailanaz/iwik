<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iwik — I Wish I Knew</title>
<style>
  :root {
    --red: #e8221a;
    --black: #111111;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #ffffff;
    font-family: 'Georgia', 'Times New Roman', serif;
  }

  .hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .logo-stack {
    width: min(300px, 55vw);
  }

  /* top portion of the logo image — the bulb and heart */
  .bulb-crop {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 0.665;
    overflow: hidden;

    opacity: 0;
    transform: translateY(-140px);
    animation: dropIn 1.6s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
  }

  .bulb-crop img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    display: block;
  }

  /* bottom portion of the same logo image — the wordmark */
  .text-crop {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 0.335;
    overflow: hidden;

    opacity: 0;
    animation: fadeIn 1.8s ease-out forwards;
    animation-delay: 1.1s;
  }

  .text-crop img {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    display: block;
  }

  @keyframes dropIn {
    0% {
      opacity: 0;
      transform: translateY(-140px);
    }
    60% {
      opacity: 1;
    }
    100% {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>

  <section class="hero">
    <div class="logo-stack">
      <div class="bulb-crop">
        <img src="iwik-logo.png" alt="iwik bulb and heart mark">
      </div>
      <div class="text-crop">
        <img src="iwik-logo.png" alt="iwik — I Wish I Knew">
      </div>
    </div>
  </section>

</body>
</html>
